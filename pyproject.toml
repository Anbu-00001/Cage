[project]
name = "constraint-cage"
version = "0.1.0"
description = "A CPU-only, single-laptop escape-lab benchmark: does a small quantized agent discover and chain engineered in-guest trust boundaries — per joule, with a failure taxonomy?"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps are pinned loosely here and exactly in requirements.txt.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Make the repo root importable so `src.*`, `eval.*`, `challenges.*` resolve in tests.
pythonpath = ["."]
testpaths = ["tests", "eval/tests"]
addopts = "-q"

[tool.setuptools]
# This is a research repo run in-place, not a distributable package — no build.
py-modules = []
